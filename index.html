<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Финансовый трекер</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --bg:#f3f5f8; --panel:#fff; --panel-2:#f8fafc; --border:#e5e9f0;
    --text:#161c26; --muted:#697586; --accent:#2f6bff; --accent-soft:#e9f0fe;
    --green:#12a150; --green-soft:#e6f6ee; --red:#e5484d; --red-soft:#fdecec; --amber:#c98a00;
    --asset:#12a150; --passive:#c98a00; --liab:#e5484d;
    --shadow:0 1px 2px rgba(20,30,50,.05),0 8px 24px rgba(20,30,50,.05);
    --radius:14px; --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --bg:#0e1220; --panel:#151a29; --panel-2:#1b2233; --border:#28304a;
    --text:#e8ecf4; --muted:#93a0b5; --accent:#5b8bff; --accent-soft:#1c2740;
    --green:#3ecf7f; --green-soft:#12341e; --red:#ff6b6f; --red-soft:#3a1b1d; --amber:#e2a53a;
    --asset:#3ecf7f; --passive:#e2a53a; --liab:#ff6b6f;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);
  }}
  *{box-sizing:border-box} html,body{margin:0;overscroll-behavior-y:none} html{scroll-behavior:smooth;touch-action:pan-x pan-y}
  body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.45}
  .scroll-x{overflow-x:auto;scrollbar-width:thin}
  .scroll-x::-webkit-scrollbar{height:8px} .scroll-x::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px}
  .scroll-x::-webkit-scrollbar-thumb:hover{background:var(--muted)}
  h1,h2,h3{margin:0;font-weight:650;letter-spacing:-.01em}
  button{font-family:inherit;font-size:14px;cursor:pointer;border:none;background:none;color:inherit}
  input,select{font-family:inherit;font-size:14px;color:var(--text)}
  .wrap{max-width:1200px;margin:0 auto;padding:calc(20px + env(safe-area-inset-top,0px) + var(--tg-top,0px)) 18px calc(80px + env(safe-area-inset-bottom,0px) + var(--tg-bottom,0px))}
  header.top{display:flex;align-items:center;gap:13px;margin-bottom:18px;flex-wrap:wrap}
  .logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,#2f6bff,#8a5bff);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:18px}
  .title-block h1{font-size:18px}
  .title-block p{margin:1px 0 0;color:var(--muted);font-size:12.5px}
  .sp{flex:1}
  .icon-btn{padding:8px 12px;border-radius:10px;border:1px solid var(--border);background:var(--panel);color:var(--muted);font-size:13px;transition:color .15s,border-color .15s,background .15s}
  .icon-btn:hover{color:var(--text);border-color:var(--accent)}
  .icon-btn.on{background:var(--accent-soft);color:var(--accent);border-color:transparent}
  .cur-toggle{display:inline-flex;border:1px solid var(--border);border-radius:9px;overflow:hidden}
  .cur-toggle button{padding:7px 12px;color:var(--muted);font-weight:600}
  .cur-toggle button.on{background:var(--accent-soft);color:var(--accent)}

  nav.tabs{display:flex;gap:4px;background:var(--panel);border:1px solid var(--border);padding:5px;border-radius:12px;margin-bottom:20px;overflow-x:auto;position:sticky;top:calc(8px + env(safe-area-inset-top,0px) + var(--tg-top,0px));z-index:20;box-shadow:var(--shadow);scrollbar-width:none}
  nav.tabs::-webkit-scrollbar{display:none}
  nav.tabs button{padding:9px 15px;border-radius:8px;color:var(--muted);font-weight:550;white-space:nowrap;transition:color .15s,background .15s}
  nav.tabs button.active{background:var(--accent-soft);color:var(--accent);font-weight:650;box-shadow:0 1px 3px rgba(47,107,255,.15)}
  nav.tabs button:hover:not(.active){color:var(--text);background:var(--panel-2)}

  .grid{display:grid;gap:15px}
  .cards{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:17px 19px;box-shadow:var(--shadow);transition:transform .16s,box-shadow .16s}
  .card:hover{transform:translateY(-2px);box-shadow:0 2px 4px rgba(20,30,50,.06),0 14px 34px rgba(20,30,50,.09)}
  .card .lbl{color:var(--muted);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.03em}
  .card .val{font-size:26px;font-weight:720;margin-top:7px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .card .sub{margin-top:5px;font-size:13px;color:var(--muted)}
  .card.hero{background:linear-gradient(135deg,var(--accent),#7a5bff);color:#fff;border:none}
  .card.hero .lbl,.card.hero .sub{color:rgba(255,255,255,.85)}
  .card.hero .val{font-size:34px}
  .net-inline{margin-top:14px;padding-top:16px;border-top:1px solid var(--border);text-align:center}
  .net-inline .lbl{color:var(--muted);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.03em}
  .net-inline .val{font-size:30px;font-weight:720;margin-top:6px;letter-spacing:-.02em;font-variant-numeric:tabular-nums;background:linear-gradient(135deg,var(--accent),#7a5bff);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .net-inline .sub{margin-top:6px;font-size:13px;color:var(--muted)}
  .pos{color:var(--green)} .neg{color:var(--red)}
  .chip{display:inline-block;padding:2px 8px;border-radius:20px;font-size:12px;font-weight:600}
  .chip.up{background:rgba(255,255,255,.2)} .chip.down{background:rgba(0,0,0,.15)}
  .chip.g{background:var(--green-soft);color:var(--green)} .chip.r{background:var(--red-soft);color:var(--red)}

  .panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);margin-top:15px}
  .panel-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 19px;border-bottom:1px solid var(--border);flex-wrap:wrap}
  .panel-h h2{font-size:16px}
  .panel-b{padding:16px 19px}
  table{width:100%;border-collapse:collapse}
  th,td{padding:9px 11px;text-align:right;font-size:14px;border-bottom:1px solid var(--border)}
  td{font-variant-numeric:tabular-nums}
  th:first-child,td:first-child{text-align:left;font-variant-numeric:normal}
  th{color:var(--muted);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.03em}
  tbody tr{transition:background .12s} tbody tr:hover{background:var(--panel-2)}
  tr.group-row td{font-weight:700;background:var(--panel-2);font-size:13px;text-transform:uppercase;letter-spacing:.02em;border-top:2px solid var(--border)}
  tr.cap-group,tr.cap-cat,tr.cap-sub{cursor:pointer}
  tr.cap-group:hover td,tr.cap-cat:hover td,tr.cap-sub:hover td{background:var(--accent-soft)}
  .caret{display:inline-block;width:15px;color:var(--muted);font-size:11px}
  .asset-link{cursor:pointer;border-bottom:1px dashed var(--border)} .asset-link:hover{color:var(--accent);border-bottom-color:var(--accent)}
  tr.sub-row td:first-child{padding-left:24px}
  tr.cat-row td{font-weight:650;background:var(--panel-2)}
  tr.cat-row td:first-child{padding-left:22px}
  tr.item-row td:first-child{padding-left:40px}
  tr.sub2-row td{font-weight:600}
  tr.sub2-row td:first-child{padding-left:40px}
  tr.item2-row td:first-child{padding-left:58px}
  tr.total-row td{font-weight:750;border-top:2px solid var(--border);font-size:15px}
  .dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:7px;vertical-align:middle}
  .tag{display:inline-block;padding:1px 7px;border-radius:6px;font-size:11px;font-weight:600}
  .tag.asset{background:var(--green-soft);color:var(--green)}
  .tag.passive{background:rgba(201,138,0,.14);color:var(--amber)}
  .tag.liability{background:var(--red-soft);color:var(--red)}
  .tag.reserve{background:var(--accent-soft);color:#5c7cfa}
  .tag.activity{background:rgba(214,64,159,.14);color:#d6409f}

  .btn{padding:9px 15px;border-radius:10px;font-weight:600;font-size:14px;background:var(--accent);color:#fff;display:inline-flex;align-items:center;gap:6px;transition:filter .15s,border-color .15s,color .15s,transform .1s}
  .btn:hover{filter:brightness(1.07)} .btn:active{transform:translateY(1px)} .btn.ghost{background:var(--panel);color:var(--text);border:1px solid var(--border)}
  .btn.ghost:hover{border-color:var(--accent);color:var(--accent)} .btn.sm{padding:6px 11px;font-size:13px} .btn.danger{background:var(--red)}
  .inp{padding:8px 10px;border-radius:9px;border:1px solid var(--border);background:var(--panel-2);width:100%;transition:border-color .15s,box-shadow .15s,background .15s}
  .inp:focus{outline:none;border-color:var(--accent);background:var(--panel);box-shadow:0 0 0 3px var(--accent-soft)}
  input[type=number]{text-align:right;font-variant-numeric:tabular-nums}
  .field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
  .field label{font-size:12.5px;color:var(--muted);font-weight:600}
  .month-nav{display:inline-flex;align-items:center;gap:2px;background:var(--panel-2);border:1px solid var(--border);border-radius:10px;padding:3px}
  .month-nav button{padding:6px 11px;border-radius:7px;color:var(--muted);font-weight:700}
  .month-nav button:hover{color:var(--text);background:var(--panel)} .month-nav .cur{font-weight:650;padding:0 10px;min-width:92px;text-align:center;font-size:14px}
  .muted{color:var(--muted)} .hint{font-size:12.5px;color:var(--muted)} .scroll-x{overflow-x:auto}
  .toolbar{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
  .legend{display:flex;flex-wrap:wrap;gap:13px;margin-top:12px} .legend .item{display:flex;align-items:center;gap:6px;font-size:13px}
  .bar{height:10px;border-radius:6px;background:var(--panel-2);display:flex;overflow:hidden;margin:8px 0}
  .two-col{display:grid;grid-template-columns:1.5fr 1fr;gap:15px} @media(max-width:840px){.two-col{grid-template-columns:1fr}}
  .three-col{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px} @media(max-width:720px){.three-col{grid-template-columns:1fr}}
  svg .gl{stroke:var(--border);stroke-width:1} svg text{fill:var(--muted);font-size:11px;font-family:var(--font)}
  .modal-bg{position:fixed;inset:0;background:rgba(10,15,30,.5);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
  .modal{background:var(--panel);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);width:100%;max-width:460px;max-height:90vh;overflow:auto}
  .modal-h{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
  .modal-b{padding:19px} .modal-f{padding:14px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:9px}
  .x{font-size:22px;color:var(--muted);padding:2px 6px;border-radius:6px} .x:hover{background:var(--panel-2)}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:11px 20px;border-radius:10px;font-weight:600;font-size:14px;box-shadow:var(--shadow);z-index:99;opacity:0;transition:.2s}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}
  .empty{text-align:center;padding:44px 20px;color:var(--muted)} .empty .big{font-size:38px;margin-bottom:10px}
  .link-btn{color:var(--accent);font-weight:600;font-size:13px} .link-btn.del{color:var(--red)}
  .seg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
  .pill{padding:5px 11px;border-radius:20px;border:1px solid var(--border);font-size:12.5px;color:var(--muted);font-weight:600}
  .pill.on{background:var(--accent-soft);color:var(--accent);border-color:transparent}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="logo">₿</div>
    <div class="title-block"><h1>Финансовый трекер</h1><p id="subtitle">Активы · Пассивы · Обязательства</p></div>
    <div class="month-nav" id="monthNav" style="display:none"></div>
    <div class="sp"></div>
    <div class="cur-toggle" id="curToggle"></div>
    <button class="icon-btn" id="hzBtn" onclick="toggleHideZero()" title="Скрыть/показать нулевые балансы"></button>
    <button class="icon-btn" id="eyeBtn" onclick="toggleHideAmt()" title="Скрыть суммы (чувствительный режим)"></button>
    <button class="icon-btn" id="themeBtn">◐</button>
    <input type="file" id="imp" accept=".json" style="display:none" onchange="importJSON(event)">
  </header>
  <nav class="tabs" id="tabs"></nav>
  <div id="repayAlerts"></div>
  <div id="view"></div>
</div>
<div id="modal-root"></div>
<div class="toast" id="toast"></div>

<script>
/* ================= Финансовый трекер v2 ================= */
const LS='fintracker_v2';
/* ===== Telegram Mini App integration ===== */
const TG = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : null;
const IN_TG = !!(TG && TG.platform && TG.platform!=='unknown'); // реальный запуск внутри Telegram
const CLOUD = !!(IN_TG && TG.CloudStorage && typeof TG.CloudStorage.setItem==='function');
function csGet(key){return new Promise(r=>{try{TG.CloudStorage.getItem(key,(e,v)=>r(e?null:v));}catch(_){r(null);}});}
function csGetItems(keys){return new Promise(r=>{try{TG.CloudStorage.getItems(keys,(e,v)=>r(e?{}:(v||{})));}catch(_){r({});}});}
function csSet(key,val){return new Promise(r=>{try{TG.CloudStorage.setItem(key,val,(e,ok)=>r(!e&&ok));}catch(_){r(false);}});}
function csRemove(keys){return new Promise(r=>{try{TG.CloudStorage.removeItems(keys,()=>r());}catch(_){r();}});}
function b64enc(s){return btoa(unescape(encodeURIComponent(s)));}
function b64dec(s){return decodeURIComponent(escape(atob(s)));}
let pushT, cloudBusy=false, pushPending=false;
function scheduleCloudPush(){ if(!CLOUD)return; clearTimeout(pushT); pushT=setTimeout(cloudPush,1500); }
async function cloudPush(){
  if(!CLOUD)return;
  if(cloudBusy){ pushPending=true; return; } // уже идёт отправка — не теряем правку, отправим повторно сразу после
  cloudBusy=true;
  try{
    const b64=b64enc(JSON.stringify(S)); const CH=3800; const n=Math.max(1,Math.ceil(b64.length/CH));
    let oldN=0; const om=await csGet('ft_meta'); if(om){try{oldN=JSON.parse(om).n||0;}catch(_){}}
    for(let i=0;i<n;i++){ await csSet('ft_'+i, b64.slice(i*CH,(i+1)*CH)); }
    if(oldN>n){const rm=[];for(let i=n;i<oldN;i++)rm.push('ft_'+i);await csRemove(rm);}
    await csSet('ft_meta', JSON.stringify({n:n,t:nowTs(),v:2}));
    lastCloudSyncTs=nowTs();
    setSync('☁ '+syncAgoLabel());
  }catch(e){ setSync('☁ ошибка синка'); }
  cloudBusy=false;
  if(pushPending){ pushPending=false; scheduleCloudPush(); }
}
async function cloudPull(){
  if(!CLOUD)return null;
  const meta=await csGet('ft_meta'); if(!meta)return null;
  let m; try{m=JSON.parse(meta);}catch(_){return null;} if(!m||!m.n)return null;
  if(m.t)lastCloudSyncTs=m.t; // последняя точка синка из облака (до нашего первого пуша в этой сессии)
  const keys=[];for(let i=0;i<m.n;i++)keys.push('ft_'+i);
  const items=await csGetItems(keys);
  let b64='';for(let i=0;i<m.n;i++){ b64+=(items['ft_'+i]||''); }
  try{ return JSON.parse(b64dec(b64)); }catch(_){ return null; }
}
function nowTs(){try{return Date.now();}catch(_){return 0;}}
function setSync(txt){const el=document.getElementById('syncStatus');if(el)el.textContent=txt;}
let lastCloudSyncTs=0; // когда последний раз реально успешно записали в облако (своё или с прошлой загрузки)
function syncAgoLabel(){if(!lastCloudSyncTs)return'ещё не синхронизировано';const s=Math.max(0,Math.round((nowTs()-lastCloudSyncTs)/1000));
  if(s<5)return'синхронизировано только что';if(s<60)return`синхр. ${s} сек. назад`;const m=Math.round(s/60);if(m<60)return`синхр. ${m} мин. назад`;return`синхр. ${Math.round(m/60)} ч. назад`;}
// исходный статус синка для отрисовки Настроек (setSync потом может перезаписать текст живым статусом,
// но сам элемент теперь пересоздаётся при каждом render() — нужно значение сразу, а не только через setSync)
function syncStatusText(){
  if(CLOUD)return '☁ Telegram Cloud · '+syncAgoLabel();
  if(fileHandle)return (fileOK?'💾 файл «'+fileHandle.name+'»':'💾 файл «'+fileHandle.name+'» — нажми 🔗 для доступа');
  return '';
}
function tickSyncStatus(){if(CLOUD&&tab==='settings')setSync(syncStatusText());}
async function clearCloudData(){
  if(!CLOUD)return;
  const meta=await csGet('ft_meta');let n=0;if(meta){try{n=JSON.parse(meta).n||0;}catch(_){}}
  const keys=['ft_meta'];for(let i=0;i<Math.max(n,20);i++)keys.push('ft_'+i); // с запасом, если счётчик разошёлся
  await csRemove(keys);
  lastCloudSyncTs=0;setSync('☁ облако очищено');toast('Данные в облаке Telegram удалены (локально остались)');
}
function clearCloudConfirm(){confirmModal('Очистить облако Telegram?','Удалит сохранённую копию в CloudStorage этого бота. Локальные данные в этом устройстве не трогает — после следующей правки запишется заново (если не отключишь синк).',clearCloudData);}
function applyTgTheme(){ if(!TG)return; try{ const cs=TG.colorScheme; if(cs)document.documentElement.setAttribute('data-theme',cs);
  if(TG.setHeaderColor)TG.setHeaderColor('secondary_bg_color'); if(TG.setBackgroundColor)TG.setBackgroundColor('bg_color'); }catch(_){} }
// отступ под СОБСТВЕННЫЙ чат-бар Telegram (Закрыть/▾/•••) — это НЕ вырез телефона (env(safe-area-inset-top) его не знает),
// а своя полоса поверх страницы; Telegram начиная с Bot API 8.0 сообщает её высоту через contentSafeAreaInset/safeAreaInset.
function applyTgSafeArea(){ if(!TG)return; try{
    const c=TG.contentSafeAreaInset||{}, s=TG.safeAreaInset||{};
    const top=Math.max(+c.top||0,+s.top||0), bottom=Math.max(+c.bottom||0,+s.bottom||0);
    document.documentElement.style.setProperty('--tg-top',top+'px');
    document.documentElement.style.setProperty('--tg-bottom',bottom+'px');
  }catch(_){} }
async function initApp(){
  initTheme();
  if(IN_TG){ try{ TG.ready(); TG.expand();
    // requestFullscreen (Bot API 8.0+) вместо просто expand(): в обычном «развёрнутом» (не fullscreen) режиме
    // Telegram сам управляет свайпом вниз как жестом «подвинуть/свернуть лист» — это их родной UX подвижного
    // bottom-sheet, и disableVerticalSwipes его не всегда полностью гасит (особенно когда палец начинает жест
    // над уже проскроленным до упора списком). В настоящем fullscreen режиме такого подвижного листа нет вообще.
    TG.requestFullscreen&&TG.requestFullscreen();
    applyTgTheme(); applyTgSafeArea();
    TG.disableVerticalSwipes&&TG.disableVerticalSwipes(); // доп. слой — гасит свайп-закрытие/сворачивание там, где fullscreen недоступен (старый клиент)
    TG.enableClosingConfirmation&&TG.enableClosingConfirmation(); // подстраховка: даже если свайп всё же дойдёт до закрытия — спросит подтверждение, а не закроет молча (старее API, шире поддержка клиентов)
    TG.onEvent&&TG.onEvent('themeChanged',applyTgTheme);
    TG.onEvent&&TG.onEvent('safeAreaChanged',applyTgSafeArea);
    TG.onEvent&&TG.onEvent('contentSafeAreaChanged',applyTgSafeArea);
    TG.onEvent&&TG.onEvent('viewportChanged',applyTgSafeArea);
    TG.onEvent&&TG.onEvent('fullscreenChanged',applyTgSafeArea);
    TG.onEvent&&TG.onEvent('fullscreenFailed',()=>{ try{TG.disableVerticalSwipes&&TG.disableVerticalSwipes();}catch(_){} }); // клиент не поддерживает fullscreen — остаёмся на старой защите
  }catch(_){} }
  render();
  if(!CLOUD)restoreFileHandle();
  autoFetchRates();
  try{if(nowTs()-(S.cryptoPxUpdated||0)>2*3600*1000)fetchCryptoPrices({silent:true});}catch(e){}
  try{const lm=latestMonth();if(lm)ensureMonthCryptoPx(lm,{silent:true});}catch(e){}
  if(CLOUD){
    setSync('☁ загрузка…');
    const cloud=await cloudPull();
    cloudPullDone=true;
    if(pendingLocalEdit){ if(S.items&&S.items.length)scheduleCloudPush(); setSync('☁ локальные правки сохранены'); } // правка сделана до завершения загрузки — не затираем её пришедшим снапшотом

  const m=S.months[k];if(m&&m.fx&&m.fx[cur]!=null&&m.fx[cur]!=='')return +m.fx[cur]; // свой курс месяца зафиксирован
  const lm2=latestMonth();if((!lm2||k>=lm2)&&S.fx&&S.fx[cur]!=null&&S.fx[cur]!=='')return +S.fx[cur]; // живой курс только для текущего/будущего месяца
  const ks2=monthList().filter(x=>x<=k).reverse();for(const x of ks2){const mm=S.months[x];if(mm.fx&&mm.fx[cur]!=null&&mm.fx[cur]!=='')return +mm.fx[cur];}

// парсер выражения: «100+200*3-50/2» → число (сложение/вычитание/умножение/деление, приоритет × ÷)
function parseExpr(str){if(str==null)return null;str=(''+str).replace(/\s/g,'').replace(/,/g,'.');if(str==='')return null;let sum=0,any=false,allOk=true;
  for(let t of str.split(/(?=[+-])/)){if(t==='')continue;const sign=t[0]==='-'?-1:1;const body=t.replace(/^[+-]/,'');if(body==='')continue;
    const f=body.split(/(?=[*/])/);let prod=parseFloat(f[0]),ok=isFinite(prod);
    for(let i=1;i<f.length&&ok;i++){const op=f[i][0];const n=parseFloat(f[i].slice(1));if(!isFinite(n)){ok=false;break;}op==='*'?prod*=n:(prod/=n,prod=isFinite(prod)?prod:null,ok=prod!=null);}

// спец-контрагент «Личные деньги» (внешний, тратный мир). «Непогашенный ущерб» убран — заменён нереализованной прибылью.

function isSpendAccount(id){const it=S.items.find(x=>x.id===id);return !!(it&&it.group==='reserve'&&it.spending);}

// расчётный результат продажи/вывода актива: сумма − цена покупки (плюс = прибыль, минус = убыток)
function movePnlAuto(mv){if(!mv||!mv.amt)return 0;const it=S.items.find(x=>x.id===mv.from);if(!it)return 0;const toItem=S.items.find(x=>x.id===mv.to);const toIsExit=(mv.to===PERSONAL||(toItem&&toItem.group==='reserve'));if(!toIsExit)return 0;if(it.group!=='asset'&&it.group!=='passive')return 0;if(it.cost==null||it.cost==='')return 0;return (+mv.amt)-(+it.cost);}

function clampPct(v){v=+v;if(!isFinite(v))return 0;return Math.max(0,Math.min(100,v));}
// ЦЕЛЕВОЙ % реинвеста строки (план): по строке m.reinvest[id] либо общий S.reinvestTarget
function incomeReinvest(id,k){const m=S.months[k];const p=(m&&m.reinvest&&m.reinvest[id]!=null&&m.reinvest[id]!=='')?m.reinvest[id]:(S.reinvestTarget!=null?S.reinvestTarget:0);return clampPct(p)/100;}
// НП = реинвестировано − обязательство отложить (цель%). Доход: +фактически на накопит.счёт, −цель%×доход (должен был отложить). Минус гасится переводом тратный→накопит.
function npState(){let unreal=0,real=0;const gr=clampPct(S.reinvestTarget!=null?S.reinvestTarget:0)/100;monthList().forEach(k=>{const m=S.months[k];
    S.items.forEach(i=>{const inc=monthIncomeUSD(i.id,k);if(inc){const acc=m.incomeTo&&m.incomeTo[i.id];if(acc&&!isSpendAccount(acc))unreal+=inc;unreal-=inc*incomeReinvest(i.id,k);}}); // +реинвест (накопит), −обязательство (цель%)
    (m.extra||[]).forEach(e=>{const amt=e.amount?toUSD(+e.amount,e.cur||'USD',k):0;if(amt){if(e.to&&!isSpendAccount(e.to))unreal+=amt;unreal-=amt*gr;}}); // прочие доходы — так же (цель по общему %)

      else if(amt){ const fs=isSpendSide(mv.from),ts=isSpendSide(mv.to); if(!fs&&ts)unreal-=amt; else if(fs&&!ts)unreal+=amt; } // перевод через границу инвест/траты

// Переводы накопительный↔тратный считаются независимо от группы (USDT→тратный столь же «реализация», как продажа актива).
function investmentNpState(uptoK){let unreal=0,real=0;const gr=clampPct(S.reinvestTarget!=null?S.reinvestTarget:0)/100;monthList().filter(x=>!uptoK||x<=uptoK).forEach(k=>{const m=S.months[k];
    S.items.filter(i=>i.group!=='passive').forEach(i=>{const inc=monthIncomeUSD(i.id,k);if(inc){const acc=m.incomeTo&&m.incomeTo[i.id];if(acc&&!isSpendAccount(acc)&&!isSpendSide(acc))unreal+=inc;unreal-=inc*incomeReinvest(i.id,k);}});
    movesOf(k).forEach(mv=>{const fromIt=S.items.find(x=>x.id===mv.from),toIt=S.items.find(x=>x.id===mv.to);

// фактический реинвест за месяц: доход на накопит.счета / весь доход
function reinvestPct(k){const m=S.months[k];if(!m)return null;let inv=0,tot=0;S.items.forEach(i=>{const inc=monthIncomeUSD(i.id,k);if(inc){tot+=inc;const acc=m.incomeTo&&m.incomeTo[i.id];if(acc&&!isSpendAccount(acc))inv+=inc;}});(m.extra||[]).forEach(e=>{const amt=e.amount?toUSD(+e.amount,e.cur||'USD',k):0;if(amt){tot+=amt;if(e.to&&!isSpendAccount(e.to))inv+=amt;}});return tot>0?inv/tot:null;}
function targetReinvestPct(k){const m=S.months[k];if(!m)return null;let plan=0,tot=0;const gr=clampPct(S.reinvestTarget!=null?S.reinvestTarget:0)/100;S.items.forEach(i=>{const inc=monthIncomeUSD(i.id,k);if(inc){tot+=inc;plan+=inc*incomeReinvest(i.id,k);}});(m.extra||[]).forEach(e=>{const amt=e.amount?toUSD(+e.amount,e.cur||'USD',k):0;if(amt){tot+=amt;plan+=amt*gr;}});return tot>0?plan/tot:gr;}
function setIncomeReinvest(id,pct){const m=mo(curMonth);m.reinvest=m.reinvest||{};m.reinvest[id]=(pct===''||pct==null)?'':clampPct(pct);save();}
// сколько доходов за месяц без выбранного счёта (обязательно выбрать)
function incomeNoAccount(k){const m=S.months[k];if(!m)return 0;let n=0;S.items.forEach(i=>{if(Math.abs(monthIncomeUSD(i.id,k))>0.01&&!(m.incomeTo&&m.incomeTo[i.id]))n++;});(m.extra||[]).forEach(e=>{const amt=e.amount?toUSD(+e.amount,e.cur||'USD',k):0;if(Math.abs(amt)>0.01&&!e.to)n++;});return n;}
function setIncomeTo(id,acc){mo(curMonth).incomeTo[id]=acc||'';save();render();}
function addMove(){mo(curMonth).moves.push({date:curMonth+'-01',from:'',to:'',amt:null});save();render();}
function setMove(idx,f,v){const mv=mo(curMonth).moves[idx];if(!mv)return;if((f==='to'||f==='from')&&v==='__new__'){moveCreateTarget(idx,f);return;}
  mv[f]=(f==='amt'||f==='usherb')?(v===''?null:+v):v;if(f==='from'||f==='to'||f==='date')afterMoveChange();save();if(f!=='amt'&&f!=='usherb')render();}
// сумма транзакции вводится в выбранной валюте (можно выражением +/-), ХРАНИТСЯ в USD (по курсу месяца)
function moveRate(mv,k){return (mv.rate!=null&&mv.rate!=='')?+mv.rate:fxRate(mv.cur||'USD',k);} // курс транзакции: свой (если задан) иначе курс месяца
function setMoveAmt(idx,val){const mv=mo(curMonth).moves[idx];if(!mv)return;const num=parseExpr(val);if(num==null){mv.amt=null;mv.amtExpr='';}else{mv.amtExpr=(''+val);mv.amt=num/(moveRate(mv,curMonth)||1);}save();updTot();}
function setMoveCur(idx,cur){const mv=mo(curMonth).moves[idx];if(!mv)return;mv.cur=cur;mv.rate=null;/* курс был для старой валюты — сбрасываем на курс месяца по умолчанию */save();render();}
// свой курс транзакции (напр. реально обменял по другому курсу, чем в среднем за месяц); пусто — обратно курс месяца
function setMoveRate(idx,val){const mv=mo(curMonth).moves[idx];if(!mv)return;mv.rate=(val===''||val==null)?null:+val;
  if(mv.amtExpr){const num=parseExpr(mv.amtExpr);if(num!=null)mv.amt=num/(moveRate(mv,curMonth)||1);}
  save();render();}
// крипто-транзакция: количество × цена → сумма в USD. Количество холдинга пересчитывается из транзакций.
function setMoveQP(idx,f,v){const mv=mo(curMonth).moves[idx];if(!mv)return;mv[f]=(v===''||v==null)?null:(f==='qty'?parseExpr(v):+v);const q=mv.qty!=null?+mv.qty:0,px=mv.px!=null?+mv.px:0;mv.amt=q*px;mv.cur='USD';afterMoveChange();save();}
function afterMoveChange(){recomputeCryptoQtyAfter(curMonth);recomputeCryptoCost();updTot();}
function recomputeCryptoQtyAfter(startK){const ks=monthList().filter(k=>k>=startK);ks.forEach(k=>recomputeCryptoQty(k));}
function recomputeCryptoQty(k){const m=mo(k);S.items.forEach(it=>{if(!it.byQty)return;let buys=0,sells=0,has=false;movesOf(k).forEach(mv=>{if(mv.qty==null||mv.qty==='')return;if(mv.to===it.id){buys+=+mv.qty;has=true;}if(mv.from===it.id){sells+=+mv.qty;has=true;}});
  if(has){const pv=prevExist(k);const base=pv!=null?(itemQty(it.id,pv)||0):0;m.qty[it.id]=base+buys-sells;if(m.qtyExpr)m.qtyExpr[it.id]='';m.qtyFromMoves[it.id]=true;}
  else if(m.qtyFromMoves[it.id]){delete m.qty[it.id];delete m.qtyFromMoves[it.id];} // транзакции удалены — не оставлять фантомное количество, посчитанное по ним ранее
});}
// цена покупки (cost) крипты — СРЕДНЕВЗВЕШЕННАЯ: докупка усредняет, продажа списывает по средней. Хронологический пересчёт от базиса (импортированный cost + докупки).
function recomputeCryptoCost(){S.items.forEach(it=>{if(!it.byQty)return;
  let firstTx=null;monthList().forEach(k=>{if(firstTx)return;movesOf(k).forEach(mv=>{if(mv.qty&&(mv.to===it.id||mv.from===it.id))firstTx=firstTx||k;});});
  if(!firstTx){ if(it.qtyBase!=null){it.cost=(it.costBase!=null?it.costBase:it.cost);delete it.qtyBase;delete it.costBase;delete it._firstTx;delete it._costSeed;} return; } // нет транзакций — вернуть базис
  if(it.qtyBase==null||it._firstTx!==firstTx){const pv=prevExist(firstTx);it.qtyBase=(pv!=null?itemQty(it.id,pv):null)||0;
    if(it._costSeed==null)it._costSeed=(it.cost!=null&&it.cost!=='')?+it.cost:0; // базовая себестоимость фиксируется ОДИН раз (до первой транзакции) — иначе повторный пересчёт возьмёт уже посчитанное it.cost и удвоит суммы
    it.costBase=it.qtyBase>0?it._costSeed:0;it._firstTx=firstTx;}
  let qty=it.qtyBase,cost=it.costBase;
  monthList().forEach(k=>{const mvs=movesOf(k).filter(mv=>mv.qty&&(mv.to===it.id||mv.from===it.id)).slice().sort((a,b)=>((a.date||'99')>(b.date||'99')?1:-1));
    mvs.forEach(mv=>{const Q=+mv.qty,P=(mv.px!=null&&mv.px!=='')?+mv.px:0;if(mv.to===it.id){qty+=Q;cost+=Q*P;}else{if(qty>0)cost-=Q*(cost/qty);qty-=Q;}});});
  it.cost=Math.round(Math.max(0,cost));});}
function delMove(idx){const a=mo(curMonth).moves;if(idx>=0&&idx<a.length){a.splice(idx,1);afterMoveChange();save();render();}}
function moveCreateTarget(idx,field){field=field||'to';modal('Новая позиция',`
   <div class="field"><label>Название</label><input class="inp" id="qcn" placeholder="Напр. Машина 6, новый актив"></div>
   <div class="field"><label>Группа</label><select class="inp" id="qcg">${Object.entries(GROUPS).map(([kk,v])=>`<option value="${kk}" ${kk==='asset'?'selected':''}>${v}</option>`).join('')}</select></div>
   <div class="field"><label>Категория</label><input class="inp" id="qcc" list="qclist" placeholder="категория"><datalist id="qclist">${[...new Set(S.categories.map(c=>c.name))].map(n=>`<option>${esc(n)}</option>`).join('')}</datalist></div>`,()=>{
   const name=document.getElementById('qcn').value.trim();if(!name){toast('Введите название');return false;}
   const grp=document.getElementById('qcg').value; let cat=document.getElementById('qcc').value.trim()||'Прочее';
   if(!S.categories.some(c=>c.name===cat))S.categories.push({name:cat,group:grp,color:PALETTE[S.categories.length%PALETTE.length]});
   const nid=uid();S.items.push({id:nid,name,group:grp,category:cat,currency:'USD',income:{mode:'variable'},createdAt:curMonth});
   const mv=mo(curMonth).moves[idx];if(mv)mv[field]=nid;save();render();toast('Позиция создана');});}
// приток на счёт (USD): доход, зачисленный сюда + переводы сюда − переводы отсюда
function accountInflowUSD(accId,k){const m=S.months[k];if(!m)return 0;let s=0;
  S.items.forEach(i=>{if(m.incomeTo&&m.incomeTo[i.id]===accId)s+=monthIncomeUSD(i.id,k);});
  (m.extra||[]).forEach(e=>{if(e.to===accId&&e.amount)s+=toUSD(+e.amount,e.cur||'USD',k);});
  movesOf(k).forEach(mv=>{if(mv.amt){if(mv.to===accId)s+=(+mv.amt);if(mv.from===accId)s-=(+mv.amt);}});
  return s;}
// «тело» счёта в ЕГО ВАЛЮТЕ, рекурсивно: явное значение месяца, иначе прошлое (в валюте) + приток этого месяца
// (переведённый в валюту по курсу ЭТОГО месяца). Нужно, чтобы RUB-позиции без транзакций в месяце
// продолжали переоцениваться по текущему курсу (как раньше через carriedVal), а не замораживались в $
// на момент последней транзакции — иначе курс рубля «забывается» как только счёт становится авто-считаемым.
function accountValueNative(id,k){const v=itemVal(id,k);if(v!=null)return v;const pv=prevExist(k);const prevNative=pv!=null?accountValueNative(id,pv):0;
  const it=S.items.find(x=>x.id===id);const cur=it?it.currency:'USD';return prevNative+accountInflowUSD(id,k)*fxRate(cur,k);}
// ожидаемый остаток счёта (USD) = прошлое тело (в валюте, переоценённое по курсу ЭТОГО месяца) + приток этого месяца (USD)
function accountExpectedUSD(accId,k){const it=S.items.find(x=>x.id===accId);const cur=it?it.currency:'USD';const pv=prevExist(k);
  const prevNative=pv!=null?accountValueNative(accId,pv):0;return toUSD(prevNative,cur,k)+accountInflowUSD(accId,k);}
// расход = сумма недостач на всех счетах трат (введено < ожидаемого)
function monthExpenseUSD(k){let total=0;S.items.filter(i=>isSpendAccount(i.id)).forEach(sp=>{const diff=itemValUSD(sp.id,k)-accountExpectedUSD(sp.id,k);if(diff<0)total+=-diff;});return total;}
// нарастающим итогом: доход минус расход по всем месяцам до k включительно. Это и есть «нереализованная прибыль со знаком минус» —
// если тратишь больше, чем зарабатываешь, разница не исчезает после смены месяца, а продолжает копиться (пока не отработаешь обратно).
// Считаем ТОЛЬКО с месяца, когда завели двойную запись доходов/расходов (S.cashflowStartMonth) — до этого
// доход/расход не вводились системно, и сумма по старым месяцам — не реальный перерасход, а шум.
function cashSurplusUSD(k){const start=S.cashflowStartMonth||'2026-09';let s=0;monthList().filter(x=>x<=k&&x>=start).forEach(x=>s+=(totalIncomeUSD(x)-monthExpenseUSD(x)));return s;}
// «инвестиции» в широком смысле юзера: ВСЁ, что не тратный счёт (не только группа asset)
function nonSpendTotalUSD(k){return S.items.reduce((s,i)=>s+(isSpendAccount(i.id)?0:itemValUSD(i.id,k)),0);}
// нереализованная прибыль «если продать всё сейчас»: текущая цена минус цена покупки (или первая известная, если покупка неизвестна),
// плюс накопленный доход — т.е. просто сумма itemPnL().total. Резерв/деятельность исключены (это кэш-счета без цены покупки:
// их «рост» — обычно просто внесённые деньги, а не прибыль); архивные — тоже (иначе висел бы фантомный убыток до нуля).
function unrealizedMTMUSD(k){return S.items.filter(i=>i.group!=='reserve'&&i.group!=='activity'&&!isArch(i,k)).reduce((s,i)=>s+itemPnL(i.id,k).total,0);}
function setQty(id,v){const m=mo(curMonth);m.qtyExpr=m.qtyExpr||{};const num=parseExpr(v);if(num==null){m.qty[id]=null;m.qtyExpr[id]='';}else{m.qty[id]=num;m.qtyExpr[id]=(''+v);}delete m.qtyFromMoves[id];save();}
// подтвердить перенесённое количество крипты (записать в этот месяц явно)
function confirmQty(id){const q=itemQty(id,curMonth);if(q!=null){const m=mo(curMonth);m.qty[id]=q;delete m.qtyFromMoves[id];save();render();toast('Подтверждено');}}
function confirmAllQty(){const k=curMonth,m=mo(k);let n=0;S.items.forEach(i=>{if(i.byQty&&!isArch(i,k)&&(m.qty[i.id]==null||m.qty[i.id]==='')){const q=itemQty(i.id,k);if(q!=null){m.qty[i.id]=q;delete m.qtyFromMoves[i.id];n++;}}});if(n){save();render();toast('Подтверждено: '+n);}else toast('Нет перенесённых');}
function setTrade(id,side,f,v){const m=mo(curMonth);const qk=side==='buy'?'buyq':'sellq',pk=side==='buy'?'buypx':'sellpx',tk=side==='buy'?'dep':'wd';
  m[qk][id]=(f==='q')?(v===''?null:+v):m[qk][id]; m[pk][id]=(f==='px')?(v===''?null:+v):m[pk][id];
  const q=m[qk][id],px=m[pk][id]; m[tk][id]=(q!=null&&px!=null)?q*px:(m[tk][id]); save();}
/* ---- движения денег (пополнения/выводы) и сверка ---- */
function depUSD(id,k){const it=S.items.find(x=>x.id===id);const m=S.months[k];if(!it||!m||!m.dep)return 0;const v=m.dep[id];return (v==null||v==='')?0:toUSD(+v,it.currency,k);}
function wdUSD(id,k){const it=S.items.find(x=>x.id===id);const m=S.months[k];if(!it||!m||!m.wd)return 0;const v=m.wd[id];return (v==null||v==='')?0:toUSD(+v,it.currency,k);}
function flowInTotal(k){return S.items.reduce((s,i)=>s+depUSD(i.id,k),0);}
function flowOutTotal(k){return S.items.reduce((s,i)=>s+wdUSD(i.id,k),0);}
// рыночный рост актива за месяц = изменение стоимости − пополнение + вывод
function moveNetInto(id,k){let s=0;movesOf(k).forEach(mv=>{if(mv.amt){if(mv.to===id)s+=+mv.amt;if(mv.from===id)s-=+mv.amt;}});return s;}
function marketGainUSD(id,k){const pv=prevExist(k);if(pv==null)return 0;const prevV=itemValUSD(id,pv);if(prevV===0)return 0;/* первое появление позиции — не рыночный прирост, иначе годовая доходность улетает (напр. крипта в месяц перехода = +1200%) */const dv=itemValUSD(id,k)-prevV;return dv-depUSD(id,k)+wdUSD(id,k)-moveNetInto(id,k);}
function marketGainTotal(k){return S.items.reduce((s,i)=>s+marketGainUSD(i.id,k),0);}
// «доходность-вклад» позиции за месяц: только доход (для крипты годовая доходность из месяца бессмысленна → 0, её рост показывается отдельно как рост от покупки)
function itemMonthReturnUSD(id,k){const it=S.items.find(x=>x.id===id);if(!it||it.noIncome)return 0;return monthIncomeUSD(id,k);}
// агрегатная доходность набора: если ВСЕ позиции «только рост цены» (крипта) — общий рост от цены покупки; иначе годовых от дохода
function aggYield(items,k){if(!items||!items.length)return null;const v=items.reduce((s,i)=>s+itemValUSD(i.id,k),0);if(items.every(i=>i.noIncome)){const cost=items.reduce((s,i)=>s+((i.cost!=null&&i.cost!=='')?+i.cost:0),0);return cost>0?(v-cost)/cost:null;}const c=items.reduce((s,i)=>s+itemMonthReturnUSD(i.id,k),0);return (v>0&&c)?(c*12)/v:null;}
// «необъяснено»: нетто вложенного в активы должно = доход − расход. Иначе деньги из воздуха.
function unexplainedUSD(k){const m=S.months[k];if(!m)return 0;const netIn=flowInTotal(k)-flowOutTotal(k);const income=totalIncomeUSD(k);const expense=(m.cashflow&&m.cashflow.expense)?+m.cashflow.expense:0;return netIn-(income-expense);}
function itemVal(id,k){const m=S.months[k];if(!m||m.values[id]==null||m.values[id]==='')return null;return m.values[id];}
// последнее введённое значение в прошлом месяце (перенос для стабильного имущества)
function carriedVal(id,k){const ks=monthList().filter(x=>x<k).reverse();for(const x of ks){const m=S.months[x];const v=(m&&m.values)?m.values[id]:undefined;if(v!=null&&v!=='')return +v;}return null;}
// значение позиции в валюте позиции с учётом переноса (non-reserve: если поле пустое — берём из прошлого месяца; reserve — только явный ввод для сверки)
function isAutoAcct(it){return !!(it&&(it.group==='reserve'||it.group==='activity'||it.group==='liability'||it.selfReinvest));} // позиции, чей остаток считается сам из транзакций/дохода (а не переносится вручную)
function itemValRaw(id,k){const v=itemVal(id,k);if(v!=null)return v;const it=S.items.find(x=>x.id===id);if(it&&!isAutoAcct(it)&&!it.byQty)return carriedVal(id,k);return null;}
// позиция в архиве с месяца archivedAt: в этом и последующих месяцах не считается и не показывается; более ранняя история цела
function isArch(it,k){return !!(it&&it.archivedAt&&k>=it.archivedAt);}
function itemValUSD(id,k){const it=S.items.find(x=>x.id===id);if(!it)return 0;
  if(isArch(it,k))return 0;
  if(it.byQty){const q=itemQty(id,k);if(q==null)return 0;return q*cryptoPrice(it.symbol,k);}
  const v=itemValRaw(id,k);
  if(v==null){if(isAutoAcct(it))return accountExpectedUSD(id,k);return 0;} // reserve/activity/liability/selfReinvest: значение = прошлый остаток + доход сюда + транзакции (не рыночная переоценка). Для liability транзакция «на долг» корректно гасит его, т.к. его сумма хранится отрицательной
  return toUSD(v,it.currency,k);}
function catColor(name){const c=S.categories.find(c=>c.name===name);return c?c.color:'#8a91a1';}
function catGroup(name){const c=S.categories.find(c=>c.name===name);return c?c.group:'asset';}

/* ---- график погашения долга (обязательства: вручную / ежемесячно / график платежей) ----
   Остаток долга (в валюте позиции) и так считается сам из транзакций (accountValueNative) — здесь
   мы только СРАВНИВАЕМ его с тем, что «должно было быть оплачено по плану на сегодня», чтобы поймать
   просрочку. План не хранит факт оплаты по шагам — статус каждой строки выводится из разницы между
   накопленной суммой строк графика и уже реально погашенным (= стартовый долг минус текущий остаток). */
function repayBaselineMonth(it){const ks=monthList();return ks.find(k=>itemVal(it.id,k)!=null)||it.createdAt||ks[0]||curMonth;}
function repayBaselineNative(it){return accountValueNative(it.id,repayBaselineMonth(it));}
// нормализованный план платежей [{date:'YYYY-MM-DD',amount}] в валюте позиции, по возрастанию даты
function repayPlan(it){
  if(!it||!it.repayMode||it.repayMode==='manual')return [];
  if(it.repayMode==='schedule')return (it.repaySchedule||[]).filter(r=>r&&r.date&&r.amount).slice().sort((a,b)=>a.date<b.date?-1:1);
  if(it.repayMode==='monthly'){
    const amt=+it.repayMonthly||0;if(!amt)return [];
    const todayStr=new Date().toISOString().slice(0,10);
    const rows=[];let k=it.createdAt||repayBaselineMonth(it);let guard=0;
    while(guard++<600){const d=k+'-01';rows.push({date:d,amount:amt});if(d>todayStr)break;k=shiftMonth(k,1);} // одна строка с запасом после сегодня — виден «следующий платёж»
    return rows;
  }
  return [];
}
// статус по каждой строке плана (paid/overdue/upcoming), выведен из факта (сколько реально погашено к latestMonth) vs плана (сколько должно быть погашено по датам)
function repayStatus(it){
  const plan=repayPlan(it);if(!plan.length)return null;
  const base=-repayBaselineNative(it); // долг на момент начала отслеживания (положительное число)
  const lk=latestMonth()||curMonth;
  const actualOwed=-accountValueNative(it.id,lk); // остаток сейчас (положительное число)
  const totalPaidActual=base-actualOwed;
  const todayStr=new Date().toISOString().slice(0,10);
  let cum=0;
  const rows=plan.map(r=>{cum+=+r.amount;const done=cum<=totalPaidActual+0.01;const status=done?'paid':(r.date<todayStr?'overdue':'upcoming');return Object.assign({},r,{cumExpected:cum,status});});
  return{rows,base,actualOwed,totalPaidActual,overdue:rows.filter(r=>r.status==='overdue'),upcoming:rows.find(r=>r.status==='upcoming')};
}
// все просроченные/скоро-предстоящие (в пределах недели) платежи по всем долгам — для баннера, видимого на любой вкладке
function repayAlerts(){
  const k=latestMonth()||curMonth,soonMs=7*24*3600*1000,now=Date.now(),out=[];
  S.items.filter(i=>i.group==='liability'&&i.repayMode&&i.repayMode!=='manual'&&!isArch(i,k)).forEach(it=>{

}

function setRepayRow(id,i,f,v){const it=S.items.find(x=>x.id===id);if(!it||!it.repaySchedule||!it.repaySchedule[i])return;it.repaySchedule[i][f]=(f==='amount')?(v===''?null:+v):v;save();}

/* ---- computations ---- */
function groupTotalUSD(g,k){return S.items.filter(i=>i.group===g).reduce((s,i)=>s+itemValUSD(i.id,k),0);}
function netWorthUSD(k){return S.items.reduce((s,i)=>s+itemValUSD(i.id,k),0);}
const PPY={day:365,month:12,quarter:4,year:1};
const PERIOD_SHORT={day:'дн',month:'мес',quarter:'кв',year:'год'};
function normMonthly(per,period){return per*(PPY[period]||12)/12;}
function incomeCfg(it){return (it && it.income && typeof it.income==='object')?it.income:{mode:'variable'};}
// проценты считаются от остатка НА НАЧАЛО месяца (= закрытие прошлого месяца), не от текущего — иначе (а) не работает без ручного перевводения значения каждый месяц (carry-forward не читается), (б) зацикливается при самореинвесте (тело зависит от дохода этого же месяца).
// Берём остаток В ВАЛЮТЕ ПОЗИЦИИ (не $) — иначе «5%/мес» на рублёвом займе плыл бы от курса доллара между месяцами, а не от реальной суммы в рублях.
function computedIncomeCur(it,k){const c=incomeCfg(it);if(c.mode!=='fixed')return null;
  if(c.by==='percent'){const pv=prevExist(k);let baseNative=0;if(pv!=null){baseNative=it.selfReinvest?accountValueNative(it.id,pv):(itemVal(it.id,pv)!=null?+itemVal(it.id,pv):(carriedVal(it.id,pv)||0));}return normMonthly(baseNative*(+c.rate||0)/100,c.period||'month');}
  return normMonthly(+c.rate||0,c.period||'month');}
function incomeDesc(it){const c=incomeCfg(it);if(c.mode!=='fixed')return 'вручную';return (c.by==='percent'?((+c.rate||0)+'%'):('фикс '+ (+c.rate||0)))+'/'+(PERIOD_SHORT[c.period]||'мес');}
function monthIncomeUSD(id,k){const it=S.items.find(x=>x.id===id);if(!it)return 0;if(isArch(it,k))return 0;const m=S.months[k];const ov=m?m.income[id]:null;if(ov!=null&&ov!=='')return +ov;/* доход хранится СРАЗУ в USD (зафиксирован по курсу на момент ввода) */
  if(it.selfReinvest&&m&&m.values[id]!=null&&m.values[id]!=='')return marketGainUSD(id,k); // переоценка: явно введён остаток в «Остатках» → доход = изменение стоимости (как у обычного актива), а не % формула
  const c=incomeCfg(it);if(c.mode==='fixed'){const v=computedIncomeCur(it,k);return v==null?0:toUSD(v,it.currency,k);}return 0;}
// «реально пришедший» доход (не просто начисление/капитализация на риске контрагента): для selfReinvest-позиций
// (займы с капитализацией %) считаем доходом за месяц только то, что реально ВЫВЕДЕНО на другой счёт —
// пока деньги просто прибавляются к телу того же долга, это не прибыль месяца (могут не вернуть вовсе),
// а чисто нереализованная прибыль (учитывается в НП/стоимости позиции, не в «Доход за месяц»)
function isCashIncome(i,k){if(!i.selfReinvest)return true;const m=S.months[k];const acc=m&&m.incomeTo&&m.incomeTo[i.id];return !!(acc&&acc!==i.id);}
function totalIncomeUSD(k){let s=S.items.reduce((a,i)=>a+(isCashIncome(i,k)?monthIncomeUSD(i.id,k):0),0);const m=S.months[k];if(m&&m.extra)m.extra.forEach(e=>{if(e.amount&&e.type!=='capital')s+=toUSD(+e.amount,e.cur||'USD',k);});return s;} // type='capital' (продажа имущества) — не прибыль, не в доход
function isActiveIncomeItem(i){return (i.incomeType||i.group)==='activity';} // группа 'activity' = активный доход, если не переопределено вручную
function passiveIncomeUSD(k){let s=S.items.reduce((a,i)=>a+((isCashIncome(i,k)&&!isActiveIncomeItem(i))?monthIncomeUSD(i.id,k):0),0);const m=S.months[k];if(m&&m.extra)m.extra.forEach(e=>{if(e.amount&&e.type!=='active'&&e.type!=='capital')s+=toUSD(+e.amount,e.cur||'USD',k);});return s;}
function activeIncomeUSD(k){let s=S.items.reduce((a,i)=>a+((isCashIncome(i,k)&&isActiveIncomeItem(i))?monthIncomeUSD(i.id,k):0),0);const m=S.months[k];if(m&&m.extra)m.extra.forEach(e=>{if(e.amount&&e.type==='active')s+=toUSD(+e.amount,e.cur||'USD',k);});return s;}
function moExtra(k){const m=mo(k);if(!m.extra)m.extra=[];return m.extra;}
function extraTotalUSD(k){const m=S.months[k];if(!m||!m.extra)return 0;return m.extra.reduce((s,e)=>s+(e.amount?toUSD(+e.amount,e.cur||'USD',k):0),0);}
function fundsTotalUSD(k){const m=S.months[k];if(!m)return 0;return S.fundAccounts.reduce((s,a)=>{const v=m.funds[a.id];return s+(v==null||v===''?0:toUSD(v,a.currency,k));},0);}
// item pnl since first appearance
function itemPnL(id,k){const it=S.items.find(x=>x.id===id);const cur=itemValUSD(id,k);
  const ks=monthList().filter(x=>x<=k);let first=null;for(const x of ks){if(itemVal(id,x)!=null){first=itemValUSD(id,x);break;}}
  let inc=0;const skipIncome=(it&&(it.group==='reserve'||it.group==='activity'));if(!skipIncome)ks.forEach(x=>inc+=monthIncomeUSD(id,x));
  // цена покупки (cost basis, зафиксирована в $) — если задана, прибыль считается от неё. НО: cost — свойство
  // самой позиции (не помесячное), а месяцы ДО её появления (first==null, т.е. ни разу не было явного ввода
  // по этот месяц включительно) всё равно имеют cur=0 (позиции тогда ещё не существовало) — без доп. условия
  // base=cost давало бы change=0−cost на КАЖДЫЙ такой древний месяц, пока позиция не появится, раздувая
  // «Нереализ. прибыль (рынок)» огромным мнимым убытком на всей истории ДО покупки актива (поймано юзером —
  // на древних месяцах, задолго до появления позиций с заданной ценой покупки, висело стабильное большое отрицательное число).
  const hasCost = it && it.cost!=null && it.cost!=='' && (first!=null || cur!==0);
  const base = hasCost ? +it.cost : (first==null?cur:first);
  const change = cur - base;
  // principal-позиции (займы/наличка/обязательства/свободные средства): изменение стоимости = движение тела, НЕ прибыль.
  // group='liability' — принципал ВСЕГДА (даже без явной галочки): гашение долга (транзакциями/графиком) — это
  // перекладка денег, а не прибыль. Иначе новый пассив без проставленного чекбокса засчитывает своё собственное
  // погашение в «Нереализ. прибыль (рынок)» (поймано юзером на свежесозданном пассиве-рассрочке —
  // автодогоняющий остаток создавал огромный мнимый change). Явная галочка it.principal остаётся — для группы liability она теперь избыточна,
  // но ничего не ломает (все старые liab_*/loan_* и так уже её имели).
  const principal=!!(it&&(it.principal||it.group==='liability'));
  const total = principal ? inc : (change+inc);
  // ДОХОДНОСТЬ (годовых): для доходных активов — от дохода за месяц; для «только рост цены» — от рыночного роста.
  const monthInc = monthIncomeUSD(id,k);
  const noIncome = !!(it && it.noIncome);
  const growth = (hasCost && base>0) ? (cur-base)/base : null; // рост стоимости с покупки, %
  // ДОХОДНОСТЬ: доходные активы — годовых от дохода за месяц; «только рост цены» (крипта) — ОБЩИЙ рост от цены покупки (annualized из одного месяца для цены скачет ±1000% — бессмысленно)
  const roi = noIncome ? growth : ((cur>0 && monthInc) ? (monthInc*12)/cur : null);
  return{value:cur,first:first||0,cost:hasCost?+it.cost:null,change,income:inc,total,monthInc,roi,growth,noIncome,principal};}

function setFx(c,v){if(!S.fx)S.fx={};S.fx[c]=v===''?'':+v;save();}
function setFxAdjust(c,v){if(!S.fxAdjust)S.fxAdjust={};S.fxAdjust[c]=v===''?'':+v;save();}
function setFxEnabled(c,v){if(!S.fxEnabled)S.fxEnabled={};S.fxEnabled[c]=!!v;save();}
// пересчитать уже ЗАФИКСИРОВАННЫЕ курсы прошлых месяцев с учётом текущей поправки. Безопасно для повторного
// запуска (напр. если поправку потом подправите) — всегда считает от ИСХОДНОГО (до поправки) курса в
// m.fxRaw/m.rateRaw, а не от уже скорректированного m.fx/m.rate, иначе каждый прогон удваивал бы поправку.
// Месяцы, зафиксированные ДО появления этой фичи, не имеют fxRaw — тогда текущее m.fx и есть исходное
// (поправки тогда не было), берём его как базу и запоминаем на будущее.
function reapplyFxAdjust(){
  if(!S.fxAdjust)return 0;
  let n=0;
  monthList().forEach(k=>{
    const m=S.months[k];if(!m)return;
    if(S.fxAdjust.RUB&&m.rate!=null){
      if(m.rateRaw==null)m.rateRaw=+m.rate;
      m.rate=+m.rateRaw*(1+(+S.fxAdjust.RUB)/100);n++;
    }
    if(m.fx){
      m.fxRaw=m.fxRaw||{};
      Object.keys(m.fx).forEach(c=>{
        if(!S.fxAdjust[c])return;
        if(m.fxRaw[c]==null)m.fxRaw[c]=+m.fx[c];
        m.fx[c]=+m.fxRaw[c]*(1+(+S.fxAdjust[c])/100);n++;
      });
    }
  });
  save();return n;
}
// исторический курс USD→cur на конкретную дату (ECB reference через frankfurter.dev, бесплатно без ключа,
// покрывает основные валюты; на выходных/праздниках отдаёт ближайший будний день — для наших целей норм)
async function fetchHistoricalFxOnDate(dateStr,cur){
  try{const r=await fetch(`https://api.frankfurter.dev/v1/${dateStr}?from=USD&to=${cur}`,{cache:'no-store'});
    const j=await r.json();const v=j&&j.rates&&j.rates[cur];return v!=null?+v:null;}catch(e){return null;}}
// зафиксировать курс cur в месяце k, если ещё не зафиксирован — подтягивает историческую дату (1-е число),
// кэширует в m.fx/m.fxRaw (та же пара полей, что и у обычной автозагрузки — reapplyFxAdjust их тоже видит)
async function ensureMonthFxHistorical(k,cur){
  if(cur==='USD'||cur==='USDT')return 1;
  const m=mo(k);
  if(m.fx&&m.fx[cur]!=null&&m.fx[cur]!=='')return +m.fx[cur];
  const v=await fetchHistoricalFxOnDate(k+'-01',cur);
  await new Promise(r=>setTimeout(r,300)); // троттлинг — только когда реально ходили в сеть
  if(v!=null){m.fx=m.fx||{};m.fxRaw=m.fxRaw||{};m.fx[cur]=v;m.fxRaw[cur]=v;save();return v;}
  return null;
}
// без своего зафиксированного курса месяц показывает ОДИН И ТОТ ЖЕ «запасной» курс (ближайший найденный ГДЕ
// УГОДНО в истории, не обязательно рядом по времени — см. fxRate()) вместо актуального на свою дату. Это и
// заметил юзер: позиция в THB с перенесённым значением показывала одинаковый $-эквивалент много месяцев
// подряд. Бэкафилл — та же идея, что ensureMonthCryptoPx/backfillMonthlyCryptoPx, но для валютных курсов.
async function backfillMonthlyFx(){
  const ks=monthList();if(!ks.length){toast('Нет месяцев');return;}
  // только реально используемые позициями валюты — иначе при десятках месяцев это лишние сотни запросов
  // (видел юзер: ~1.5 мин на 59 мес × 5 валют) ради валют, которых ни у одной позиции и нет
  const used=new Set(S.items.map(i=>i.currency));
  const curs=FX_FETCH_CURRENCIES.filter(c=>(!S.fxEnabled||S.fxEnabled[c]!==false)&&used.has(c));
  if(!curs.length){toast('Нет включённых валют, которые реально используются в позициях');return;}
  toast('Восстанавливаю курсы по месяцам ('+curs.join(', ')+')… это займёт время');
  for(const k of ks)for(const c of curs)await ensureMonthFxHistorical(k,c);
  render();toast('Готово: курсы валют зафиксированы по месяцам');
}
// смена валюты позиции С ПЕРЕСЧЁТОМ истории (не просто переименование поля): каждое уже введённое значение
// месяца переводится в $ по курсу СТАРОЙ валюты за тот месяц, затем — в новую валюту по курсу той же даты
// (исторический курс подтягивается автоматически, если за этот месяц ещё не зафиксирован). Без этого смена
// валюты просто переинтерпретирует старые числа без конвертации — ровно баг, который поймал юзер на реальной позиции.
async function convertItemCurrency(id,newCur){
  const it=S.items.find(x=>x.id===id);if(!it)return{changed:0,failed:0};
  const oldCur=it.currency;if(oldCur===newCur)return{changed:0,failed:0};
  const ks=monthList().filter(k=>{const v=itemVal(id,k);return v!=null&&v!=='';});
  let changed=0,failed=0;
  for(const k of ks){
    const raw=itemVal(id,k);
    const usd=toUSD(+raw,oldCur,k);
    let rate=(newCur==='USD'||newCur==='USDT')?1:await ensureMonthFxHistorical(k,newCur);
    if(rate==null){rate=fxRate(newCur,k);failed++;} // точную историческую не нашли — обычный фолбэк (ближайшая зафиксированная/дефолт)
    const m=mo(k);m.values[id]=usd*rate;
    if(m.valuesExpr)m.valuesExpr[id]=''; // старое выражение было в прежней валюте — больше не соответствует числу
    changed++;
  }
  it.currency=newCur;save();
  return{changed,failed};
}

// цена монеты НА ДАТУ (история coingecko) — чтобы курс месяца был «на 1-е число», а не живой на момент захода
async function fetchCryptoPriceOnDate(sym,dateStr){const id=COINGECKO[sym];if(!id)return null;

// зафиксировать курс месяца k на 1-е число (для всех монет, у кого ещё нет m.px) — не трогает уже зафиксированные
async function ensureMonthCryptoPx(k,opts){opts=opts||{};
  const syms=[...new Set(S.items.filter(i=>i.byQty&&i.symbol).map(i=>i.symbol))];if(!syms.length)return;
  const m=mo(k);m.px=m.px||{};const missing=syms.filter(s=>m.px[s]==null||m.px[s]==='');if(!missing.length)return;
  for(const s of missing){const p=await fetchCryptoPriceOnDate(s,k+'-01');if(p!=null){m.px[s]=p;save();}await new Promise(r=>setTimeout(r,1300));}
  if(!opts.silent){render();toast('Курс '+mLabel(k)+' зафиксирован на 1-е число');}
  else if(tab==='dash'||tab==='capital'||tab==='entry')render();}
// восстановить «на 1-е число» для ВСЕХ месяцев, где курс ещё не зафиксирован (разово, после перехода на эту схему)
async function backfillMonthlyCryptoPx(){const ks=monthList();if(!ks.length){toast('Нет месяцев');return;}
  toast('Восстанавливаю курсы по месяцам… это займёт время');
  for(const k of ks)await ensureMonthCryptoPx(k,{silent:true});
  save();render();toast('Готово: курсы по месяцам зафиксированы на 1-е число');}
async function fetchRates(opts){opts=opts||{};const silent=opts.silent;
  // по умолчанию (если вызывающий явно не передал stamp) фиксируем курс в ТЕКУЩИЙ месяц — и обычная кнопка «Обновить»
  // в Настройках, и автообновление раз в 12ч теперь сами закрепляют курс «на начало месяца», как уже сделано для цен крипты
  const stamp=opts.stamp!==undefined?opts.stamp:(latestMonth()||thisMonth());
  if(!silent)toast('Загружаю курсы…');
  try{
    const r=await fetch('https://open.er-api.com/v6/latest/USD',{cache:'no-store'});const j=await r.json();
    if(!j||!j.rates){if(!silent)toast('Курсы недоступны');return false;}
    if(!S.fx)S.fx={};
    // поправка на реальный курс обмена (P2P/обменник отличается от официального межбанковского) — настраивается
    // в Настройках на валюту (юзер сверил свой реальный курс с официальным за тот же период и нашёл стабильное
    // отклонение) — коэффициент применяется тут
    const adj=c=>1+((S.fxAdjust&&S.fxAdjust[c])?+S.fxAdjust[c]:0)/100;
    const enabled=c=>!S.fxEnabled||S.fxEnabled[c]!==false; // галочка в Настройках — не тянуть ненужные валюты автообновлением
    FX_FETCH_CURRENCIES.forEach(c=>{if(j.rates[c]&&enabled(c))S.fx[c]=+j.rates[c]*adj(c);});
    S.fxUpdated=(j.time_last_update_unix?j.time_last_update_unix*1000:nowTs());
    if(stamp){const m=mo(stamp);m.rate=+S.fx.RUB;m.rateRaw=j.rates.RUB!=null?+j.rates.RUB:m.rateRaw;m.fx=m.fx||{};m.fxRaw=m.fxRaw||{};
      ['EUR','THB','VND','KZT','IDR'].filter(enabled).forEach(c=>{if(S.fx[c])m.fx[c]=+S.fx[c];if(j.rates[c]!=null)m.fxRaw[c]=+j.rates[c];});} // fxRaw/rateRaw — курс ДО поправки, нужен чтобы reapplyFxAdjust() мог пересчитать без повторного домножения
    save();if(!silent){render();toast('Курсы обновлены'+(stamp?', зафиксированы в '+mLabel(stamp):''));}else if(tab==='settings'||tab==='entry'){render();}
    return true;
  }catch(e){if(!silent)toast('Не удалось загрузить (нет сети)');return false;}
}
function autoFetchRates(){try{if(nowTs()-(S.fxUpdated||0)>12*3600*1000)fetchRates({silent:true});}catch(e){}}

/* ---------- charts ---------- */
function lineSVG(labels,series){const W=560,H=230,pL=52,pR=12,pT=14,pB=26;if(!labels.length)return'<div class="empty muted">Нет данных</div>';
  const all=series.flatMap(s=>s.data);let mn=Math.min(0,...all),mx=Math.max(...all,1);if(mx===mn)mx=mn+1;
  const iW=W-pL-pR,iH=H-pT-pB;const x=i=>labels.length===1?pL+iW/2:pL+iW*i/(labels.length-1);const y=v=>pT+iH*(1-(v-mn)/(mx-mn));
  let grid='';for(let s=0;s<=4;s++){const val=mn+(mx-mn)*s/4,yy=y(val);grid+=`<line class="gl" x1="${pL}" y1="${yy}" x2="${W-pR}" y2="${yy}"/><text x="${pL-7}" y="${yy+3}" text-anchor="end">${fmtShort(val,latestMonth())}</text>`;}
  let xl='';const st=Math.ceil(labels.length/7);labels.forEach((k,i)=>{if(i%st===0||i===labels.length-1)xl+=`<text x="${x(i)}" y="${H-8}" text-anchor="middle">${mLabel(k).replace(' 20',' ')}</text>`;});
  let paths=series.map(s=>{const pts=s.data.map((v,i)=>`${x(i)},${y(v)}`).join(' ');return `<polyline points="${pts}" fill="none" stroke="${s.color}" stroke-width="2.2" stroke-linejoin="round"/>`+s.data.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="2.3" fill="${s.color}"/>`).join('');}).join('');
  const zero=(mn<0&&mx>0)?`<line class="gl" x1="${pL}" y1="${y(0)}" x2="${W-pR}" y2="${y(0)}" stroke-dasharray="3 3"/>`:'';
  return `<svg viewBox="0 0 ${W} ${H}" width="100%">${grid}${zero}${xl}${paths}</svg><div class="legend">${series.map(s=>`<span class="item"><span class="dot" style="background:${s.color}"></span>${s.label}</span>`).join('')}</div>`;}
function pieSVG(map,k){const e=Object.entries(map).sort((a,b)=>b[1]-a[1]);const tot=e.reduce((s,[,v])=>s+v,0);if(tot<=0)return'<div class="empty muted">Нет данных</div>';
  const cx=88,cy=88,r=72,ir=44;let a=-Math.PI/2,arcs='';e.forEach(([c,v])=>{const f=v/tot,a2=a+f*2*Math.PI,lg=f>.5?1:0;
    const x1=cx+r*Math.cos(a),y1=cy+r*Math.sin(a),x2=cx+r*Math.cos(a2),y2=cy+r*Math.sin(a2),xi1=cx+ir*Math.cos(a2),yi1=cy+ir*Math.sin(a2),xi2=cx+ir*Math.cos(a),yi2=cy+ir*Math.sin(a);
    arcs+=`<path d="M${x1} ${y1} A${r} ${r} 0 ${lg} 1 ${x2} ${y2} L${xi1} ${yi1} A${ir} ${ir} 0 ${lg} 0 ${xi2} ${yi2} Z" fill="${catColor(c)}" stroke="var(--panel)" stroke-width="1.5"/>`;a=a2;});
  const leg=e.map(([c,v])=>`<span class="item"><span class="dot" style="background:${catColor(c)}"></span>${esc(c)} <b>${(v/tot*100).toFixed(0)}%</b></span>`).join('');
  return `<div style="display:flex;gap:18px;align-items:center;flex-wrap:wrap"><svg viewBox="0 0 176 176" width="176">${arcs}<text x="88" y="84" text-anchor="middle">всего</text><text x="88" y="100" text-anchor="middle" style="fill:var(--text);font-weight:700;font-size:12px">${fmtShort(tot,k)}</text></svg><div class="legend" style="flex-direction:column;gap:8px;margin:0">${leg}</div></div>`;}

function assetDetail(id){const it=S.items.find(x=>x.id===id);if(!it)return;const k=latestMonth()||curMonth;const p=itemPnL(id,k);const ks=monthList();

    <div class="scroll-x" style="max-height:260px;overflow-y:auto"><table><thead><tr><th>Месяц</th><th style="text-align:left">${it.byQty?'Кол-во × цена':'Значение'}</th><th>в $</th><th></th></tr></thead><tbody>${hist||'<tr><td colspan="4" class="muted">Нет данных</td></tr>'}</tbody></table></div>`;
  const r=document.getElementById('modal-root');
  r.innerHTML=`<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal" style="max-width:620px"><div class="modal-h"><h3><span class="dot" style="background:${catColor(it.category)}"></span>${esc(it.name)}</h3><button class="x" onclick="closeModal()">×</button></div><div class="modal-b">${body}</div><div class="modal-f"><button class="btn ghost sm" onclick="convertItemCurrencyModal('${id}')" title="Сменить валюту позиции, пересчитав всю историю по курсу на дату каждого месяца">🔄 Валюта</button><button class="btn ghost" onclick="closeModal()">Закрыть</button><button class="btn" onclick="closeModal();itemModal('${id}')">✎ Изменить</button></div></div></div>`;}

/* ---------- import/export ---------- */
function exportJSON(){const b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});dl(b,`fintracker-${thisMonth()}.json`);toast('Бэкап скачан');}
// скачивание файла (blob+<a download>) часто не работает внутри Telegram WebView (блокируется/игнорируется
// клиентом), а сама navigator.clipboard.writeText() в некоторых клиентах Telegram ТОЖЕ может молча не
// сработать (ограничения WebView) — поэтому помимо автокопирования всегда показываем сам текст в поле,
// которое можно выделить и скопировать вручную (зажать → «Копировать») — это работает ВЕЗДЕ, т.к. это
// обычное выделение текста средствами ОС, а не JS-API буфера обмена.
async function copyBackupToClipboard(){
  const text=JSON.stringify(S);
  let autoOk=false;
  try{await navigator.clipboard.writeText(text);autoOk=true;}catch(e){}
  const body=`<div class="hint" style="margin-bottom:10px">${autoOk?'✅ Уже скопировано в буфер автоматически — можно сразу вставлять.':'⚠️ Автокопирование не сработало — выделите текст ниже вручную (зажать → «Копировать») и вставьте куда нужно.'}</div>
    <textarea class="inp" id="bkpText" readonly style="height:200px;font-size:11px;font-family:monospace" onclick="this.select()">${esc(text)}</textarea>`;
  const r=document.getElementById('modal-root');
  r.innerHTML=`<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modal-h"><h3>Бэкап (JSON)</h3><button class="x" onclick="closeModal()">×</button></div><div class="modal-b">${body}</div><div class="modal-f"><button class="btn ghost" onclick="copyBackupToClipboard()">↻ Скопировать снова</button><button class="btn" onclick="closeModal()">Готово</button></div></div></div>`;
  const ta=document.getElementById('bkpText');if(ta){ta.focus();ta.select();}
}
function importJSON(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);const err=validateImport(d);if(err){toast(err);return;}confirmModal('Заменить данные?','Импорт перезапишет всё.',()=>{applyImport(d);});}catch(x){toast('Ошибка файла');}e.target.value='';};r.readAsText(f);}
function validateImport(d){if(!d||typeof d!=='object')return 'Не объект';if(!Array.isArray(d.items)||!d.items.every(x=>x.id&&x.name&&x.group))return 'Позиции: неверный формат';if(!d.months||typeof d.months!=='object')return 'Месяцы: неверный формат';if(!Object.keys(d.months).every(k=>/^\d{4}-\d{2}$/.test(k)))return 'Ключ месяца: неверный формат (YYYY-MM)';if(!Array.isArray(d.categories))return 'Категории: должен быть массив';return null;}
function applyImport(d){const err=validateImport(d);if(err){toast(err);return false;}S=d;['categories','fundAccounts','items'].forEach(k=>S[k]=S[k]||[]);S.months=S.months||{};if(!S.fx)S.fx=Object.assign({},DEFAULT_FX);display=S.display||'USD';curMonth=latestMonth()||thisMonth();save();render();toast('Загружено');return true;}
function pasteImport(){modal('Вставить бэкап (JSON)',`<div class="field"><label>Вставь сюда содержимое файла бэкапа (.json)</label><textarea class="inp" id="pj" style="height:150px;font-size:11px;font-family:monospace" placeholder='{"version":2, ...}'></textarea></div><div class="hint">Открой свой файл бэкапа в блокноте, выдели всё (Ctrl+A), скопируй и вставь сюда. Нужно один раз — потом данные в облаке Telegram.</div>`,()=>{let d;try{d=JSON.parse(document.getElementById('pj').value);}catch(e){toast('Некорректный JSON');return false;}return applyImport(d)!==false;});}
function exportCSV(){const ks=monthList();let L=['Месяц;Активы;Пассивы;Обязательства;ЧистыйКапитал;Доход;БалансДохРасх;НереализПрибыльРынок;НПИнвестиции;Курс'];ks.forEach(k=>{const nextK=shiftMonth(k,1);const inc=S.months[nextK]?totalIncomeUSD(nextK):'';const cs=(k>=(S.cashflowStartMonth||'2026-09'))?cashSurplusUSD(k):'';const mtm=unrealizedMTMUSD(k);const np=investmentNpState(k).unreal;L.push([mLabel(k),Math.round(disp(groupTotalUSD('asset',k),k)),Math.round(disp(groupTotalUSD('passive',k),k)),Math.round(disp(groupTotalUSD('liability',k),k)),Math.round(disp(netWorthUSD(k),k)),inc===''?'':Math.round(disp(inc,k)),cs===''?'':Math.round(disp(cs,k)),Math.round(disp(mtm,k)),Math.round(disp(np,k)),S.months[k].rate||''].join(';'));});const b=new Blob(['﻿'+L.join('\n')],{type:'text/csv;charset=utf-8'});dl(b,`fintracker-history.csv`);toast('CSV скачан');}
function dl(b,n){const u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=n;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000);}
function resetAll(){confirmModal('Стереть всё?','Активы, история — всё удалится. Сделайте бэкап.',()=>{S=blank();curMonth=thisMonth();save();render();});}

/* ---------- misc ---------- */
function empty(t,x,b,a){return `<div class="panel"><div class="empty"><div class="big">✨</div><h2 style="margin-bottom:8px">${t}</h2><p class="muted" style="max-width:420px;margin:0 auto 18px">${x}</p><button class="btn" onclick="${a}">${b}</button></div></div>`;}
// первый запуск (пустой кэш/облако): либо загрузить существующие данные, либо начать с нуля
function quickStart(){return `<div class="panel"><div class="empty">
  <div class="big">👋</div><h2 style="margin-bottom:8px">Добро пожаловать</h2>
  <p class="muted" style="max-width:420px;margin:0 auto 18px">Загрузите существующий бэкап — или начните с чистого листа, создав первый счёт.</p>
  <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
    <button class="btn" onclick="document.getElementById('imp').click()">📁 Выбрать файл</button>
    <button class="btn ghost" onclick="pasteImport()">📋 Вставить JSON</button>
    <button class="btn ghost" onclick="itemModal(null,'reserve')">➕ Создать первый счёт</button>
  </div>
  <p class="muted" style="max-width:420px;margin:18px auto 0;font-size:12.5px">«Выбрать файл» — для десктопа. В Telegram надёжнее «Вставить JSON».</p>
</div></div>`;}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
let tT;function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(tT);tT=setTimeout(()=>t.classList.remove('show'),2200);}
function initTheme(){const s=localStorage.getItem('ft_theme');if(s)document.documentElement.setAttribute('data-theme',s);document.getElementById('themeBtn').onclick=()=>{const c=document.documentElement.getAttribute('data-theme');const n=c==='dark'?'light':c==='light'?'':'dark';if(n)document.documentElement.setAttribute('data-theme',n);else document.documentElement.removeAttribute('data-theme');localStorage.setItem('ft_theme',n);if(tab==='dash')drawDash();};}
initApp();
</script>
</body>
